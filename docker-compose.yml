version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        CHAT_DATABASE_URL: ${CHAT_DATABASE_URL}
    container_name: aiconnect-app
    restart: always
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: ${DATABASE_URL}
      CHAT_DATABASE_URL: ${CHAT_DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persistent storage
      - uploads_data:/app/public/uploads
      - storage_data:/app/storage

  db:
    image: postgres:16-alpine
    container_name: aiconnect-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiconnect
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
    driver: local
  storage_data:
    driver: local
  db_data:
    driver: local